# ~/.config/tmux/tmux.conf
# The stage the crew performs on.

# ── core ─────────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"     # truecolor
set -g escape-time 0                          # no delay on ESC
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

# ── prefix: Ctrl-a (same leader as wezterm) ──────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── reload ───────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  reloaded"

# ── panes ────────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r n next-window
bind -r p previous-window
bind Space last-window
bind z resize-pane -Z

# ── copy mode: vi keys, y to yank ────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── fuzzy session switcher ───────────────────────────────────────────────────
bind s display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"

# ── popup scratch shell (Ctrl-a g) ───────────────────────────────────────────
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# ── lazygit popup (Ctrl-a G) ─────────────────────────────────────────────────
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# ── status bar: catppuccin-ish, minimal ──────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#585b70]│ "

set -g status-right-length 80
set -g status-right "#[fg=#585b70]#{?client_prefix,#[fg=#f38ba8]● ,}#[fg=#a6adc8]#(whoami)@#h #[fg=#585b70]│ #[fg=#89b4fa]%H:%M "

setw -g window-status-format "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#a6e3a1,bold] #I:#W#{?window_zoomed_flag, ,} "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"

# ── pane titles: label agent panes so the layout is readable ─────────────────
set -g pane-border-status top
set -g pane-border-format " #{?pane_title,#{pane_title},#{pane_current_command}} "
