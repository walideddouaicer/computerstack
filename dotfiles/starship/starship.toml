# ~/.config/starship.toml
# Two-line prompt: context on top, cursor on a clean line below.

format = """
$directory$git_branch$git_status$git_state\
$python$nodejs$golang$rust$docker_context$kubernetes\
$cmd_duration
$character"""

add_newline = true
command_timeout = 800

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# ── languages: only shown inside a relevant project ──────────────────────────
[python]
symbol = " "
style = "yellow"
format = '[$symbol$version( \($virtualenv\))]($style) '
detect_extensions = ["py", "ipynb"]

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
format = "[$symbol$version]($style) "

[rust]
symbol = " "
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
disabled = false

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "bright-black"

# noise reduction
[package]
disabled = true
[aws]
disabled = true
