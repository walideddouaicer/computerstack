[project]
name = "my-project"
version = "0.1.0"
requires-python = ">=3.12"
# Core only. Add the rest with `uv add` when the project actually needs them.
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── ruff: lint + format, one tool ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear, catches real bugs
    "SIM",           # simplify
    "PD",            # pandas antipatterns
    "NPY",           # numpy
    "RUF",
]
ignore = [
    "E501",    # line length is the formatter's job
    "PD901",   # `df` is a fine name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # asserts are the point in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: excluded by default, run with -m slow"]
